[workspace]
resolver = "3"
members = ["crates/vintage-core", "crates/vintage-cli"]
# crates/vintage-api joins the workspace on Day 3.

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
ed25519-zebra = "4"
futures-util = "0.3"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.21.0", features = ["macros", "rt-multi-thread"] }
# `tls-ring` selects rustls' crypto provider.
tonic = { version = "0.14", features = ["gzip", "tls-ring", "tls-webpki-roots"] }

# Zcash: same versions and git revision as zcash-devtool 0b3436b (compiled crates are shared).
incrementalmerkletree = "0.9"
orchard = { version = "0.16", default-features = false }
rand = { version = "0.10", default-features = false, features = ["sys_rng"] }
zcash_address = "=0.14.0-pre.2"
rusqlite = { version = "0.37", features = ["time"] }
zcash_client_backend = { version = "=0.25.0-pre.2", features = ["lightwalletd-tonic-tls-webpki-roots", "orchard"] }
zcash_client_sqlite = { version = "=0.23.0-pre.2", features = ["transparent-inputs", "unstable", "orchard", "serde", "test-dependencies"] }
zcash_primitives = "=0.31.0-pre.2"
zcash_protocol = "=0.11.0-pre.1"
zip321 = "=0.10.0-pre.2"

## Copied verbatim from zcash-devtool 0b3436b.
