version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
vintage-core = { path = "../../crates/vintage-core" }
vintage-verifier = { path = "../../crates/vintage-verifier" }

anyhow.workspace = true
